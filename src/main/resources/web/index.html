<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>java-aip usage</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<main>
    <header>
        <h1>Anthropic usage</h1>
        <span id="badge" class="badge badge-loading">Loading…</span>
    </header>

    <p id="fetched" class="fetched" hidden></p>

    <div id="connection" class="notice notice-error" role="alert" hidden>
        <strong>Lost contact with the application.</strong>
        <span>It will keep trying. What is shown below may be out of date.</span>
    </div>

    <div id="notice" class="notice" role="status" hidden>
        <strong id="notice-title"></strong>
        <span id="notice-detail"></span>
        <small id="notice-at"></small>
    </div>

    <section id="spend" aria-label="Spend" hidden>
        <p class="spend-line">
            <span id="spend-used" class="figure"></span>
            <span class="of">of</span>
            <span id="spend-limit" class="figure"></span>
        </p>
        <div class="bar" role="progressbar" aria-label="Spend used" aria-valuemin="0" aria-valuemax="100">
            <div id="spend-bar" class="bar-fill"></div>
        </div>
        <p class="spend-meta">
            <span id="spend-percent"></span>
            <span id="spend-severity" class="pill" hidden></span>
        </p>
    </section>

    <section id="windows" aria-label="Plan windows" hidden>
        <ul id="window-list" class="windows"></ul>
    </section>

    <p id="empty" class="empty" hidden>This account reports no usage.</p>

    <div class="actions">
        <button id="refresh" type="button">Refresh now</button>
        <span id="refreshing" class="refreshing" aria-live="polite"></span>
    </div>

    <details id="settings">
        <summary>Settings</summary>
        <div class="field">
            <label for="usage-interval">Fetch usage from Anthropic every</label>
            <span><input id="usage-interval" type="text" inputmode="numeric" autocomplete="off"> s</span>
            <small id="usage-hint"></small>
        </div>
        <div class="field">
            <label for="poll-interval">Update this window every</label>
            <span><input id="poll-interval" type="text" inputmode="numeric" autocomplete="off"> s</span>
            <small id="poll-hint"></small>
        </div>
        <p id="settings-message" class="settings-message" aria-live="polite"></p>
    </details>
</main>
<script src="view.js"></script>
<script src="app.js"></script>
</body>
</html>
