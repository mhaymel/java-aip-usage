<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>aip usage</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
<div id="top" class="top">
    <div class="strip">
        <span id="time" class="time" title="Last update" hidden></span>
        <span id="spend" class="spend" hidden>
            <span id="percent" class="percent"></span>
            <span class="amounts"><span id="used"></span> / <span id="limit"></span></span>
        </span>
        <span id="placeholder" class="placeholder">Loading…</span>

        <button id="refresh" class="icon" type="button" aria-label="Refresh now" title="Refresh now">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M13.5 8a5.5 5.5 0 1 1-1.7-4"/>
                <path d="M13.5 2.5v3.2h-3.2"/>
            </svg>
        </button>
        <span id="countdown" class="countdown" hidden></span>
        <span id="interval" class="delta delta-interval" hidden></span>
        <span id="delta-used" class="delta delta-used" hidden></span>
        <span id="delta-time" class="delta delta-time" hidden></span>

        <span class="tools">
        <button id="log-button" class="icon tiny" type="button" aria-label="Show the log" title="Show the log"
                aria-expanded="false">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.5 1.8h6l3 3v9.4h-9z"/>
                <path d="M9.5 1.8v3h3M5.5 8h5M5.5 10.6h5"/>
            </svg>
        </button>
        <button id="history-button" class="icon tiny" type="button" aria-label="Show the usage history" title="Show the usage history"
                aria-expanded="false">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="2.5" width="12" height="11" rx="1"/>
                <path d="M2 6.2h12M2 9.8h12M6.4 2.5v11"/>
            </svg>
        </button>
        <button id="errors-button" class="icon tiny" type="button" aria-label="Show the error log" title="Show the error log"
                aria-expanded="false">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 2L14.5 13.5h-13z"/>
                <path d="M8 6.5v3.2M8 11.6v.1"/>
            </svg>
        </button>
        <button id="settings-button" class="icon tiny" type="button" aria-label="Show the settings"
                title="Show the settings" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
        </span>
    </div>

    <p id="note" class="note" role="status" hidden></p>
    <p id="alert-note" class="note note-alert" role="status" hidden></p>
    <p id="connection" class="note note-error" role="alert" hidden>Lost contact with the application. Still trying.</p>
</div>

    <div id="panel" class="panel" hidden>
        <p id="panel-note" class="panel-note" hidden></p>
        <p id="panel-error" class="panel-error" role="alert" hidden></p>
        <div id="panel-lines" class="panel-lines" tabindex="0" aria-label="Newest first"></div>
        <div id="settings-view" class="settings" hidden>
            <p id="settings-error" class="panel-error" role="alert" hidden></p>
            <div id="settings-form">
                <fieldset>
                    <legend>Request</legend>
                    <label>Interval
                        <input id="set-usageIntervalSeconds" type="text" inputmode="numeric" autocomplete="off"
                               aria-label="Interval in seconds, from 5 to 3600"> s</label>
                </fieldset>
                <fieldset>
                    <legend>Main view</legend>
                    <label><input id="set-showPercentage" type="checkbox"> Percentage spent</label>
                    <label><input id="set-showCurrency" type="checkbox"> Currency symbol</label>
                    <label><input id="set-showHistoryIcon" type="checkbox"> History icon</label>
                    <label><input id="set-showLogIcon" type="checkbox"> Log icon</label>
                    <label><input id="set-showErrorIcon" type="checkbox"> Error log icon</label>
                    <label><input id="set-showInterval" type="checkbox"> Interval</label>
                    <label><input id="set-showDeltaUsed" type="checkbox"> Change in the amount used</label>
                    <label><input id="set-showDeltaTime" type="checkbox"> Time since the previous reading</label>
                    <label>Time format
                        <select id="set-timeFormat" aria-label="Time format">
                            <option value="hh:mm">hh:mm</option>
                            <option value="hh:mm:ss">hh:mm:ss</option>
                        </select></label>
                    <span class="buttons">
                        <button id="settings-maximum" type="button" title="Show everything in the main view">Maximum view</button>
                        <button id="settings-minimum" type="button" title="Show as little as possible in the main view">Minimum view</button>
                    </span>
                </fieldset>
                <fieldset>
                    <legend>History view</legend>
                    <label><input id="set-historyDate" type="checkbox"> Date</label>
                    <label><input id="set-historyZeroLines" type="checkbox"> Zero usage lines</label>
                    <label><input id="set-historyFailedLines" type="checkbox"> Failed lines</label>
                    <label><input id="set-historyDeltaUsed" type="checkbox"> Δ used</label>
                    <label><input id="set-historyDeltaTime" type="checkbox"> Δ time</label>
                </fieldset>
                <fieldset>
                    <legend>Log</legend>
                    <label><input id="set-logResponse" type="checkbox"> Log the response</label>
                </fieldset>
            </div>
            <p class="buttons">
                <button id="settings-apply" type="button">Apply</button>
                <button id="settings-restore" type="button" title="Fill in the defaults; Apply makes them take effect">Restore defaults</button>
                <button id="settings-cancel" type="button" title="Close without changing anything">Cancel</button>
            </p>
        </div>
    </div>
</div>
<!-- Measured, never seen: the table's own width, to size the history window to. -->
<div id="table-probe" class="panel-lines table-probe" aria-hidden="true"></div>
<script src="view.js"></script>
<script src="app.js"></script>
</body>
</html>
